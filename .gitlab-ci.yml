stages:
  - dependencies
  - checks
  - prototype
  - build
  - security
  - backend_deploy
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH"

variables:
  APP_CI_IMAGE: "kolesniiii/drp-ci:latest"
  APP_DEPS_DIR: "/opt/drp03"
  AST_ENABLE_MR_PIPELINES: "true"
  BUN_VERSION: "1.3.2"
  BUN_INSTALL_CACHE_DIR: "$CI_PROJECT_DIR/.bun/install/cache"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"
  SAST_EXCLUDED_ANALYZERS: "semgrep"
  VERCEL_TELEMETRY_DISABLED: "1"
  FIREBASE_FUNCTIONS_ARTIFACT_RETENTION_DAYS: "7"

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

.bun_job:
  image: "$APP_CI_IMAGE"
  cache:
    key:
      files:
        - package.json
        - bun.lock
    paths:
      - .bun/install/cache/
      - .cache/ms-playwright/
  before_script:
    - |
      if ! command -v bun >/dev/null 2>&1; then
        npm install --global "bun@$BUN_VERSION" --silent
      fi

      if [ ! -e node_modules ]; then
        if [ -d "$APP_DEPS_DIR/node_modules" ] &&
          [ -f "$APP_DEPS_DIR/package.json" ] &&
          [ -f "$APP_DEPS_DIR/bun.lock" ] &&
          cmp -s "$APP_DEPS_DIR/package.json" package.json &&
          cmp -s "$APP_DEPS_DIR/bun.lock" bun.lock; then
          ln -s "$APP_DEPS_DIR/node_modules" node_modules
          echo "Using dependencies baked into $APP_CI_IMAGE"
        else
          echo "Baked dependencies missing or stale; running bun install"
          bun install --frozen-lockfile --omit peer
        fi
      fi

      export PATH="$CI_PROJECT_DIR/node_modules/.bin:$PATH"
      bun --version

merge_policy:
  image: alpine:3.20
  stage: dependencies
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"'
    - when: never
  script:
    - |
      if [ "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" != "staging" ]; then
        echo "Only the staging branch may be merged into master."
        echo "Source branch: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
        echo "Target branch: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        exit 1
      fi
      echo "Merge policy passed: staging may be merged into master."

lint:
  extends: .bun_job
  stage: checks
  needs: []
  script:
    - bun run lint

typecheck:
  extends: .bun_job
  stage: checks
  needs: []
  script:
    - bun run typecheck

unit_tests:
  extends: .bun_job
  stage: checks
  needs: []
  script:
    - bun run test:unit

domain_tests:
  extends: .bun_job
  stage: checks
  needs: []
  script:
    - bun run test:domain

firebase_functions:
  extends: .bun_job
  stage: checks
  needs: []
  script:
    - |
      if [ ! -e functions/node_modules ]; then
        if [ -d "$APP_DEPS_DIR/functions/node_modules" ] &&
          [ -f "$APP_DEPS_DIR/functions/package.json" ] &&
          [ -f "$APP_DEPS_DIR/functions/bun.lock" ] &&
          cmp -s "$APP_DEPS_DIR/functions/package.json" functions/package.json &&
          cmp -s "$APP_DEPS_DIR/functions/bun.lock" functions/bun.lock; then
          ln -s "$APP_DEPS_DIR/functions/node_modules" functions/node_modules
          echo "Using Firebase function dependencies baked into $APP_CI_IMAGE"
        else
          echo "Baked Firebase function dependencies missing or stale; running bun install"
          (cd functions && bun install --frozen-lockfile --omit peer)
        fi
      fi
    - bun run firebase:data
    - (cd functions && bun run lint)
    - (cd functions && bun run build)

recommender_api_tests:
  image: python:3.12-slim
  stage: checks
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/recommender-api/**/*
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - backend/recommender-api/**/*
    - when: never
  cache:
    key:
      files:
        - backend/recommender-api/requirements-dev.txt
    paths:
      - .cache/pip/
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  script:
    - cd backend/recommender-api
    - pip install --quiet -r requirements-dev.txt
    - python -m pytest

e2e_tests:
  extends: .bun_job
  stage: prototype
  tags:
    - gpu
  needs: []
  script:
    - |
      if command -v apt-get >/dev/null 2>&1 && [ -w /etc/apt/apt.conf.d ]; then
        printf 'Acquire::Max-FutureTime "7200";\n' > /etc/apt/apt.conf.d/99-ci-max-future-time
      fi

      for attempt in 1 2 3; do
        if playwright install --with-deps chromium; then
          break
        fi
        if [ "$attempt" = "3" ]; then
          exit 1
        fi
        echo "Playwright browser install failed; retrying in 10s..."
        sleep 10
      done
    - bun run test:e2e
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    reports:
      junit: test-results/playwright-junit.xml

build:
  extends: .bun_job
  stage: build
  needs: []
  script:
    - bun run build
  artifacts:
    expire_in: 1 week
    paths:
      - dist/

audit:
  extends: .bun_job
  stage: security
  needs: []
  script:
    - bun run audit

dependency_scanning:
  stage: security
  needs: []

sast:
  stage: security
  needs: []
  allow_failure: false

.sast-analyzer:
  stage: security
  needs: []
  allow_failure: false

secret_detection:
  stage: security
  needs: []
  allow_failure: false

.secret-analyzer:
  stage: security
  needs: []
  allow_failure: false

.ds-analyzer:
  stage: security
  needs: []
  allow_failure: false

.deploy_gpu_server:
  image: alpine:3.20
  stage: backend_deploy
  variables:
    DEPLOY_HOST: "gru.end-pickerel.ts.net"
    DEPLOY_USER: "deploy"
    DEPLOY_DIR: "/opt/drp03-backend"
  script:
    - apk add --no-cache openssh-client rsync iptables
    - wget -q -O /tmp/tailscale.tgz "https://pkgs.tailscale.com/stable/tailscale_latest_amd64.tgz"
    - tar -xzf /tmp/tailscale.tgz -C /tmp && cp /tmp/tailscale_*/tailscale* /usr/local/bin/ && rm -rf /tmp/tailscale*
    - "tailscaled --state=mem: --tun=userspace-networking &"
    - sleep 2
    - tailscale up --authkey=${TAILSCALE_AUTH_KEY} --hostname="ci-deploy-$CI_JOB_ID" --accept-routes
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$DEPLOY_SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
    - |
      # Drive ssh/rsync through an ssh config so the ProxyCommand (which contains
      # spaces) isn't mangled by word-splitting when passed via a variable.
      printf '%s\n' \
        "Host ${DEPLOY_HOST}" \
        "  HostName ${DEPLOY_HOST}" \
        "  User ${DEPLOY_USER}" \
        "  IdentityFile ~/.ssh/deploy_key" \
        "  StrictHostKeyChecking accept-new" \
        "  ProxyCommand tailscale nc %h %p" \
        > ~/.ssh/config
      chmod 600 ~/.ssh/config

      rsync -avz --delete --exclude='.env' --exclude='__pycache__' \
        -e ssh \
        backend/ \
        "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_DIR}/"

      ALL_SERVICES="api db adminer embedding-viz grafana prometheus loki promtail node-exporter cadvisor nvidia-exporter"
      CHANGED_SERVICES=""
      CHANGED_FILES=$(git diff --name-only "$CI_COMMIT_BEFORE_SHA" "$CI_COMMIT_SHA" -- backend/ 2>/dev/null || true)

      if [ -z "$CHANGED_FILES" ] || echo "$CHANGED_FILES" | grep -q "backend/docker-compose.yml"; then
        # Empty diff (shallow clone, merge commit, or a new branch where
        # CI_COMMIT_BEFORE_SHA is absent) or a compose change: redeploy
        # everything rather than silently skipping. The job's `changes:` rule
        # already guarantees something under backend/ actually changed.
        CHANGED_SERVICES="$ALL_SERVICES"
      else
        echo "$CHANGED_FILES" | grep -q "backend/recommender-api/" && CHANGED_SERVICES="$CHANGED_SERVICES api"
        echo "$CHANGED_FILES" | grep -q "backend/db/" && CHANGED_SERVICES="$CHANGED_SERVICES db"
        echo "$CHANGED_FILES" | grep -q "backend/embedding-viz/" && CHANGED_SERVICES="$CHANGED_SERVICES embedding-viz"
        echo "$CHANGED_FILES" | grep -q "backend/monitoring/grafana/" && CHANGED_SERVICES="$CHANGED_SERVICES grafana"
        echo "$CHANGED_FILES" | grep -q "backend/monitoring/prometheus/" && CHANGED_SERVICES="$CHANGED_SERVICES prometheus"
        echo "$CHANGED_FILES" | grep -q "backend/monitoring/loki/" && CHANGED_SERVICES="$CHANGED_SERVICES loki"
        echo "$CHANGED_FILES" | grep -q "backend/monitoring/promtail/" && CHANGED_SERVICES="$CHANGED_SERVICES promtail"
        echo "$CHANGED_FILES" | grep -q "backend/monitoring/nvidia-exporter.py" && CHANGED_SERVICES="$CHANGED_SERVICES nvidia-exporter"
      fi

      CHANGED_SERVICES=$(echo "$CHANGED_SERVICES" | xargs)
      if [ -z "$CHANGED_SERVICES" ]; then
        echo "No backend services changed — skipping deploy."
        exit 0
      fi

      echo "Services to redeploy: $CHANGED_SERVICES"
      ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "cd ${DEPLOY_DIR} && bash deploy.sh $CHANGED_SERVICES"
  after_script:
    - tailscale logout 2>/dev/null || true
    - rm -f ~/.ssh/deploy_key ~/.ssh/config

deploy_gpu_staging:
  extends: .deploy_gpu_server
  needs:
    - job: lint
    - job: typecheck
    - job: recommender_api_tests
      optional: true
  environment:
    name: gpu-staging
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "staging"'
      changes:
        - backend/**/*
    - when: never

deploy_gpu_production:
  extends: .deploy_gpu_server
  needs:
    - job: lint
    - job: typecheck
    - job: recommender_api_tests
      optional: true
  environment:
    name: gpu-production
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
      changes:
        - backend/**/*
    - when: never

.deploy_vercel:
  extends: .bun_job
  stage: deploy
  script:
    - test -n "$VERCEL_TOKEN"
    - test -n "$VERCEL_ORG_ID"
    - test -n "$VERCEL_PROJECT_ID"
    - ./node_modules/.bin/vercel pull --yes --environment="$VERCEL_ENVIRONMENT" --token="$VERCEL_TOKEN"
    - ./node_modules/.bin/vercel build $VERCEL_BUILD_FLAGS --token="$VERCEL_TOKEN"
    - DEPLOYMENT_URL="$(./node_modules/.bin/vercel deploy --prebuilt $VERCEL_DEPLOY_FLAGS --token="$VERCEL_TOKEN")"
    - 'echo "Vercel deployment URL: $DEPLOYMENT_URL"'

.deploy_firebase:
  extends: .bun_job
  stage: backend_deploy
  script:
    - test -n "$FIREBASE_PROJECT_ID"
    - test -n "$FIREBASE_SERVICE_ACCOUNT_KEY_B64"
    - |
      if [ ! -e functions/node_modules ]; then
        if [ -d "$APP_DEPS_DIR/functions/node_modules" ] &&
          [ -f "$APP_DEPS_DIR/functions/package.json" ] &&
          [ -f "$APP_DEPS_DIR/functions/bun.lock" ] &&
          cmp -s "$APP_DEPS_DIR/functions/package.json" functions/package.json &&
          cmp -s "$APP_DEPS_DIR/functions/bun.lock" functions/bun.lock; then
          ln -s "$APP_DEPS_DIR/functions/node_modules" functions/node_modules
          echo "Using Firebase function dependencies baked into $APP_CI_IMAGE"
        else
          echo "Baked Firebase function dependencies missing or stale; running bun install"
          (cd functions && bun install --frozen-lockfile --omit peer)
        fi
      fi
    - echo "$FIREBASE_SERVICE_ACCOUNT_KEY_B64" | base64 -d > "$CI_PROJECT_DIR/firebase-service-account.json"
    - export GOOGLE_APPLICATION_CREDENTIALS="$CI_PROJECT_DIR/firebase-service-account.json"
    - ./node_modules/.bin/firebase functions:artifacts:setpolicy --project "$FIREBASE_PROJECT_ID" --location europe-west2 --days "$FIREBASE_FUNCTIONS_ARTIFACT_RETENTION_DAYS" --force --non-interactive
    - ./node_modules/.bin/firebase deploy --project "$FIREBASE_PROJECT_ID" --only functions,firestore:rules,firestore:indexes --non-interactive
  after_script:
    - rm -f "$CI_PROJECT_DIR/firebase-service-account.json"

deploy_firebase_staging:
  extends: .deploy_firebase
  needs:
    - job: lint
    - job: typecheck
    - job: unit_tests
    - job: domain_tests
    - job: firebase_functions
    - job: e2e_tests
    - job: build
    - job: audit
    - job: dependency_scanning
      optional: true
    - job: sast
      optional: true
    - job: secret_detection
      optional: true
  environment:
    name: staging-backend
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "staging"'
    - when: never

deploy_firebase_production:
  extends: .deploy_firebase
  needs:
    - job: lint
    - job: typecheck
    - job: unit_tests
    - job: domain_tests
    - job: firebase_functions
    - job: e2e_tests
    - job: build
    - job: audit
    - job: dependency_scanning
      optional: true
    - job: sast
      optional: true
    - job: secret_detection
      optional: true
  environment:
    name: production-backend
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
    - when: never

deploy_staging:
  extends: .deploy_vercel
  needs:
    - job: lint
    - job: typecheck
    - job: unit_tests
    - job: domain_tests
    - job: firebase_functions
    - job: e2e_tests
    - job: build
    - job: audit
    - job: dependency_scanning
      optional: true
    - job: sast
      optional: true
    - job: secret_detection
      optional: true
    - job: deploy_firebase_staging
  variables:
    VERCEL_ENVIRONMENT: preview
    VERCEL_BUILD_FLAGS: ""
    VERCEL_DEPLOY_FLAGS: ""
  environment:
    name: staging
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "staging"'
    - when: never
  script:
    - test -n "$VERCEL_TOKEN"
    - test -n "$VERCEL_ORG_ID"
    - test -n "$VERCEL_PROJECT_ID"
    - ./node_modules/.bin/vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
    - ./node_modules/.bin/vercel build --target=preview --token="$VERCEL_TOKEN"
    - DEPLOYMENT_URL="$(./node_modules/.bin/vercel deploy --prebuilt --target=preview --token="$VERCEL_TOKEN")"
    - 'echo "Vercel staging deployment URL: $DEPLOYMENT_URL"'
    - |
      if [ -n "$VERCEL_STAGING_ALIAS" ]; then
        ./node_modules/.bin/vercel alias set "$DEPLOYMENT_URL" "$VERCEL_STAGING_ALIAS" --token="$VERCEL_TOKEN"
      fi

deploy_production:
  extends: .deploy_vercel
  needs:
    - job: lint
    - job: typecheck
    - job: unit_tests
    - job: domain_tests
    - job: firebase_functions
    - job: e2e_tests
    - job: build
    - job: audit
    - job: dependency_scanning
      optional: true
    - job: sast
      optional: true
    - job: secret_detection
      optional: true
    - job: deploy_firebase_production
  variables:
    VERCEL_ENVIRONMENT: production
    VERCEL_BUILD_FLAGS: "--prod"
    VERCEL_DEPLOY_FLAGS: "--prod"
  environment:
    name: production
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
    - when: never
